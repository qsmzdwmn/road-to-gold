    <h1>ROAD TO GOLD</h1>
    <p id="notice">Loading…</p>
    <progress id="progress" value="0" max="1" aria-label="Loading game"></progress>
  </div>
  <noscript>JavaScript must be enabled to play ROAD TO GOLD.</noscript>
  <script src="$GODOT_URL" defer></script>
  <script>
    // Official Godot Web API; keep exporter-generated filenames and configuration.
    document.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('loading');
      const progress = document.getElementById('progress');
      const notice = document.getElementById('notice');
      const canvas = document.getElementById('canvas');
      function fail(error) {
        console.error(error);
        notice.textContent = 'Unable to start ROAD TO GOLD.\n' + (error instanceof Error ? error.message : String(error));
        progress.hidden = true;
      }
      try {
        if (typeof Engine === 'undefined') {
          throw new Error('The game files could not be loaded. Check your connection and reload.');
        }
        const config = $GODOT_CONFIG;
        const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
        if (missing.length) {
          throw new Error('Required browser features are unavailable: ' + missing.join(', '));
        }
        const engine = new Engine(config);
        engine.startGame({
          canvas,
          onProgress(current, total) {
            if (total > 0) {
              progress.value = current / total;
            } else {
              progress.removeAttribute('value');
            }
          },
        }).then(() => {
          overlay.remove();
          canvas.focus();
        }, fail);
      } catch (error) {
        fail(error);
      }
    }, { once: true });
  </script>
